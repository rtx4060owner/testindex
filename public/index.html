<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aizer Health — Call Center Operations</title>
  <link rel="icon" type="image/avif" href="/AizerLogo.avif" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    /* Aizer Brand Colors extracted from Logo (Deep Navy + Sky Blue) */
    .brand-bg { background-color: #0f2b5b; }
    .brand-bg-hover:hover { background-color: #173c7a; }
    .brand-text { color: #0284c7; }
    .brand-soft { background-color: #e0f2fe; }
    .brand-ring:focus { --tw-ring-color: #0284c7; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Single-Row Top Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-8">
      <div class="flex items-center justify-between gap-4 h-16">

        <!-- Left Side: Logo (Opens Home) + Navigation Tabs -->
        <div class="flex items-center gap-5 min-w-0">
          <button onclick="switchSection('home')" title="All Departments" class="flex items-center cursor-pointer shrink-0 focus:outline-none">
            <img
              src="/AizerLogo.avif"
              alt="Aizer Health"
              class="h-7 w-auto object-contain"
              onerror="this.style.display='none'; document.getElementById('fallbackLogo').classList.remove('hidden');"
            />
            <div id="fallbackLogo" class="hidden w-8 h-8 rounded-lg brand-bg flex items-center justify-center text-white shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12h4l3-7 4 14 3-7h4" />
              </svg>
            </div>
          </button>

          <div class="h-5 w-px bg-slate-200 hidden md:block shrink-0"></div>

          <!-- Horizontal Navigation Tabs -->
          <nav class="flex items-center gap-1 overflow-x-auto md:overflow-visible">
            <button id="nav-kb" onclick="switchSection('kb')" class="nav-item flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm font-medium transition brand-soft brand-text whitespace-nowrap shrink-0">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
              </svg>
              <span>Knowledge Base</span>
            </button>

            <button id="nav-providers" onclick="switchSection('providers')" class="nav-item flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition whitespace-nowrap shrink-0">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span>Providers</span>
            </button>

            <button id="nav-visits" onclick="switchSection('visits')" class="nav-item flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition whitespace-nowrap shrink-0">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span>Visit Types</span>
            </button>

            <div class="h-4 w-px bg-slate-200 mx-1 shrink-0"></div>

            <button id="nav-assistant" onclick="switchSection('assistant')" class="nav-item flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition whitespace-nowrap shrink-0">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
              </svg>
              <span>Ask Jewel</span>
            </button>
          </nav>
        </div>

        <!-- Right Side: Search Bar -->
        <div class="hidden sm:flex items-center gap-2 w-64 xl:w-72 shrink-0">
          <div class="relative flex-1">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z" />
            </svg>
            <input
              id="searchInput"
              type="text"
              placeholder="Search guidelines..."
              class="w-full pl-9 pr-12 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 brand-ring focus:border-transparent transition"
            />
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-500 hover:text-slate-800 font-medium">
              Clear
            </button>
          </div>
          <button onclick="executeSearch()" class="brand-bg brand-bg-hover text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition shrink-0">
            Search
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-7 w-full flex-1">
    <div id="loadingIndicator" class="text-sm text-slate-500 py-10">Loading guidelines...</div>

    <!-- HOME VIEW: ALL DEPARTMENTS DIRECTORY (Triggered by clicking Aizer Logo) -->
    <section id="section-home" class="content-section hidden space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-200 pb-4">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Clinical Departments</h1>
          <p class="text-sm text-slate-500 mt-0.5">Select a department to access scheduling guidelines, providers, and rules.</p>
        </div>
      </div>

      <div id="homeDepartmentsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    </section>

    <!-- SEARCH RESULTS VIEW -->
    <section id="searchSection" class="hidden space-y-5">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <h1 class="text-xl font-bold text-slate-900">Search Results</h1>
        <button onclick="clearSearch()" class="text-xs font-medium text-slate-600 hover:text-slate-900">
          &larr; Back
        </button>
      </div>
      <div id="searchResultsContainer" class="space-y-4"></div>
    </section>

    <!-- SECTION 1: KNOWLEDGE BASE -->
    <section id="section-kb" class="content-section hidden space-y-5">
      <div class="flex items-center gap-2.5">
        <img src="/icons/aizer-icons-v2_InternalMedicine.avif" alt="" class="w-6 h-6 object-contain" />
        <h1 class="text-2xl font-bold text-slate-900">Internal Medicine — Knowledge Base</h1>
      </div>

      <div id="kbPills" class="flex items-center gap-2 overflow-x-auto pb-1">
        <button onclick="filterKB('ALL', this)" class="kb-pill px-3.5 py-1.5 rounded-lg text-xs font-semibold brand-bg text-white whitespace-nowrap transition">All</button>
        <button onclick="filterKB('Core Scheduling Rules', this)" class="kb-pill px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 whitespace-nowrap transition">Core Scheduling Rules</button>
        <button onclick="filterKB('Directory & Locations', this)" class="kb-pill px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 whitespace-nowrap transition">Directory & Locations</button>
        <button onclick="filterKB('Nurse & Lab Services', this)" class="kb-pill px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 whitespace-nowrap transition">Nurse & Lab Services</button>
        <button onclick="filterKB('Telephone Encounter (TE) Routing', this)" class="kb-pill px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 whitespace-nowrap transition">TE Routing</button>
        <button onclick="filterKB('Referrals & Prior Authorizations', this)" class="kb-pill px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 whitespace-nowrap transition">Referrals & Auth</button>
        <button onclick="filterKB('Special Operational Policies', this)" class="kb-pill px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 whitespace-nowrap transition">Special Policies</button>
      </div>

      <div id="kbCardsContainer" class="space-y-4"></div>
    </section>

    <!-- SECTION 2: PROVIDERS & SPECIALISTS -->
    <section id="section-providers" class="content-section hidden space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h1 class="text-2xl font-bold text-slate-900">Providers & Specialists</h1>
        <div class="flex gap-2">
          <button onclick="filterProviders('ALL', this)" class="prov-pill px-3.5 py-1.5 rounded-lg text-xs font-semibold brand-bg text-white">All Locations</button>
          <button onclick="filterProviders('Bakertown', this)" class="prov-pill px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">Bakertown (3rd Fl)</button>
          <button onclick="filterProviders('Forest Rd', this)" class="prov-pill px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">Forest Rd (2nd Fl)</button>
        </div>
      </div>

      <div class="space-y-3">
        <h2 class="text-sm font-semibold text-slate-500">Primary Care Providers</h2>
        <div id="pcpCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <div class="space-y-3 pt-2">
        <h2 class="text-sm font-semibold text-slate-500">Specialty Providers</h2>
        <div id="specCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <!-- SECTION 3: TYPES OF VISITS -->
    <section id="section-visits" class="content-section hidden space-y-5">
      <h1 class="text-2xl font-bold text-slate-900">Types of Visits</h1>
      <div id="visitsGridContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- SECTION 4: ASK JEWEL -->
    <section id="section-assistant" class="content-section hidden space-y-5 max-w-4xl">
      <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3.5">
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            id="askInput"
            type="text"
            placeholder="Ask Jewel about Internal Medicine eligibility, routing, or policies..."
            class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:outline-none focus:ring-2 brand-ring focus:border-transparent transition"
          />
          <button onclick="executeDecision()" class="brand-bg brand-bg-hover text-white text-sm font-semibold px-6 py-2.5 rounded-lg transition shrink-0">
            Jewel it
          </button>
        </div>

        <!-- Department Selector Pills (Icon + Name, Toggle Active State) -->
        <div id="jewelDeptSelector" class="flex flex-wrap items-center gap-2 pt-0.5"></div>
      </div>

      <div id="decisionOutputContainer"></div>
    </section>

  </main>

  <script>
    let kbRecords = [];
    let activeSection = 'kb';
    let selectedJewelDept = 'internal_medicine';

    const DEPARTMENTS = [
      {
        id: 'internal_medicine',
        name: 'Internal Medicine',
        icon: '/icons/aizer-icons-v2_InternalMedicine.avif',
        active: true,
        subtitle: 'Adult Primary Care, Specialty Referrals & Scheduling SOPs'
      },
      {
        id: 'acute_care',
        name: 'Acute Care',
        icon: '/icons/aizer-icons-v2_AcuteCare.avif',
        active: false,
        subtitle: 'Walk-in Urgent Visits & Same-Day Triage'
      },
      {
        id: 'behavioral_health',
        name: 'Behavioral Health',
        icon: '/icons/aizer-icons-v2_BehavioralHealth.avif',
        active: false,
        subtitle: 'Psychiatry, Counseling & Therapy Scheduling'
      },
      {
        id: 'pediatrics',
        name: 'Pediatrics',
        icon: '/icons/aizer-icons-v2_Pediatrics.avif',
        active: false,
        subtitle: 'Well-Child Exams, Immunizations & Sick Visits'
      },
      {
        id: 'podiatry',
        name: 'Podiatry',
        icon: '/icons/aizer-icons-v2_Podiatry.avif',
        active: false,
        subtitle: 'Foot & Ankle Care, Diabetic Foot Exams'
      },
      {
        id: 'vision',
        name: 'Vision',
        icon: '/icons/aizer-icons-v2_Vision.avif',
        active: false,
        subtitle: 'Optometry, Eye Exams & Optical Services'
      },
      {
        id: 'womens_health',
        name: "Women's Health",
        icon: '/icons/aizer-icons-v2_WomensHealth.avif',
        active: false,
        subtitle: 'OB/GYN Care, Prenatal & Preventative Screenings'
      }
    ];

    function renderHomeDepartments() {
      const grid = document.getElementById('homeDepartmentsGrid');
      grid.innerHTML = DEPARTMENTS.map(dept => {
        if (dept.active) {
          return `
            <div onclick="switchSection('kb')" class="group bg-white border-2 border-sky-200 hover:border-[#0284c7] rounded-2xl p-6 cursor-pointer transition-all shadow-2xs hover:shadow-md flex flex-col justify-between">
              <div>
                <div class="flex items-start justify-between gap-3 mb-4">
                  <div class="w-12 h-12 rounded-xl bg-sky-50 border border-sky-100 flex items-center justify-center p-2">
                    <img src="${dept.icon}" alt="${dept.name}" class="w-full h-full object-contain" />
                  </div>
                  <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                    Active
                  </span>
                </div>
                <h3 class="text-base font-bold text-slate-900 group-hover:text-[#0284c7] transition">${dept.name}</h3>
                <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">${dept.subtitle}</p>
              </div>
              <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-semibold text-[#0284c7]">
                <span>Open Guidelines</span>
                <span>&rarr;</span>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="bg-slate-50/70 border border-slate-200/80 rounded-2xl p-6 opacity-75 select-none flex flex-col justify-between">
              <div>
                <div class="flex items-start justify-between gap-3 mb-4">
                  <div class="w-12 h-12 rounded-xl bg-white border border-slate-200/80 flex items-center justify-center p-2 grayscale opacity-70">
                    <img src="${dept.icon}" alt="${dept.name}" class="w-full h-full object-contain" />
                  </div>
                  <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-slate-200/70 text-slate-600">
                    Coming Soon
                  </span>
                </div>
                <h3 class="text-base font-bold text-slate-700">${dept.name}</h3>
                <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">${dept.subtitle}</p>
              </div>
              <div class="mt-5 pt-3 border-t border-slate-200/60 text-xs text-slate-400">
                SOP data pending
              </div>
            </div>
          `;
        }
      }).join('');
    }

    function renderJewelDeptSelector() {
      const container = document.getElementById('jewelDeptSelector');
      container.innerHTML = DEPARTMENTS.map(dept => {
        const isSelected = dept.id === selectedJewelDept;
        const btnClasses = isSelected
          ? 'bg-sky-50 border-[#0284c7] text-[#0f2b5b] font-semibold shadow-2xs'
          : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100 hover:text-slate-700 opacity-75 hover:opacity-100';
        const imgClasses = isSelected ? 'w-4 h-4 object-contain' : 'w-4 h-4 object-contain grayscale opacity-70';

        return `
          <button
            type="button"
            onclick="selectJewelDepartment('${dept.id}')"
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs transition ${btnClasses}"
          >
            <img src="${dept.icon}" alt="" class="${imgClasses}" />
            <span>${dept.name}</span>
          </button>
        `;
      }).join('');
    }

    function selectJewelDepartment(deptId) {
      selectedJewelDept = deptId;
      renderJewelDeptSelector();
      const dept = DEPARTMENTS.find(d => d.id === deptId);
      const input = document.getElementById('askInput');
      if (dept) {
        input.placeholder = `Ask Jewel about ${dept.name} eligibility, routing, or policies...`;
      }
    }

    function extractBulletLines(content) {
      if (!content) return [];
      const protectedText = content.replace(
        /\b(Dr|Mr|Mrs|Ms|Ext|St|Rd|Ave|vs|e\.g|i\.e|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\./gi,
        '$1__DOT__'
      );
      return protectedText
        .split(/\.\s+/)
        .map(s => s.replace(/__DOT__/g, '.').trim())
        .filter(s => s.length > 2)
        .map(s => (s.endsWith('.') || s.endsWith(':') ? s : s + '.'));
    }

    function renderStructuredChips(rules) {
      if (!rules || typeof rules !== 'object') return '';
      const entries = Object.entries(rules);
      if (!entries.length) return '';

      return `
        <div class="flex flex-wrap gap-1.5 mb-3.5">
          ${entries.map(([key, val]) => {
            const cleanKey = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            let cleanVal = '';
            if (Array.isArray(val)) cleanVal = val.join(', ');
            else if (typeof val === 'object' && val !== null) {
              cleanVal = Object.entries(val).map(([k, v]) => `${k}: ${v}`).join(' | ');
            } else if (typeof val === 'boolean') {
              cleanVal = val ? 'Yes' : 'No';
            } else {
              cleanVal = String(val);
            }

            let chipStyle = 'bg-slate-100 text-slate-700 border-slate-200';
            if (val === false || String(val).toLowerCase().includes('only')) {
              chipStyle = 'bg-rose-50 text-rose-800 border-rose-200';
            } else if (key.includes('fee') || key.includes('code') || key.includes('queue')) {
              chipStyle = 'bg-sky-50 text-sky-900 border-sky-200';
            }

            return `<span class="inline-flex items-center gap-1 text-xs px-2.5 py-0.5 rounded-md border ${chipStyle}">
              <span class="font-medium opacity-75">${cleanKey}:</span>
              <span class="font-semibold">${cleanVal}</span>
            </span>`;
          }).join('')}
        </div>
      `;
    }

    function formatPct(val) {
      return `${(Number(val || 0) * 100).toFixed(0)}%`;
    }

    function copyText(text, btnEl) {
      navigator.clipboard.writeText(text);
      const original = btnEl.innerHTML;
      btnEl.innerText = 'Copied!';
      setTimeout(() => { btnEl.innerHTML = original; }, 1400);
    }

    async function loadKB() {
      renderHomeDepartments();
      renderJewelDeptSelector();
      try {
        const res = await fetch('/kb');
        const data = await res.json();
        kbRecords = data.items || [];
        document.getElementById('loadingIndicator').classList.add('hidden');
        renderKB('ALL');
        renderProviders('ALL');
        renderVisits();
        switchSection('kb');
      } catch (e) {
        document.getElementById('loadingIndicator').innerText = 'Unable to load guidelines right now.';
      }
    }

    function switchSection(section) {
      activeSection = section;
      clearSearch(false);
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.remove('brand-soft', 'brand-text');
        el.classList.add('text-slate-600', 'hover:bg-slate-50');
      });

      const currentNav = document.getElementById(`nav-${section}`);
      if (currentNav) {
        currentNav.classList.add('brand-soft', 'brand-text');
        currentNav.classList.remove('text-slate-600', 'hover:bg-slate-50');
      }

      document.querySelectorAll('.content-section').forEach(el => el.classList.add('hidden'));
      document.getElementById(`section-${section}`).classList.remove('hidden');
    }

    function renderKB(category) {
      const kbCategories = [
        'Core Scheduling Rules', 'Directory & Locations', 'Nurse & Lab Services',
        'Telephone Encounter (TE) Routing', 'Referrals & Prior Authorizations', 'Special Operational Policies'
      ];
      let list = kbRecords.filter(r => kbCategories.includes(r.category));
      if (category !== 'ALL') list = list.filter(r => r.category === category);

      document.getElementById('kbCardsContainer').innerHTML = list.map(item => {
        const bullets = extractBulletLines(item.content);
        const chips = renderStructuredChips(item.rules);
        return `
          <div class="bg-white border border-slate-200 rounded-xl p-5">
            <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3">
              <h3 class="text-base font-bold text-slate-900">${item.entity}</h3>
              <span class="text-xs text-slate-400">${item.category}</span>
            </div>
            ${chips}
            <ul class="space-y-2 text-sm text-slate-700">
              ${bullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-slate-400 select-none">&bull;</span><span>${b}</span></li>`).join('')}
            </ul>
          </div>`;
      }).join('');
    }

    function filterKB(category, btnEl) {
      document.querySelectorAll('.kb-pill').forEach(btn => {
        btn.classList.remove('brand-bg', 'text-white', 'font-semibold');
        btn.classList.add('bg-white', 'border', 'border-slate-200', 'text-slate-700', 'font-medium');
      });
      btnEl.classList.add('brand-bg', 'text-white', 'font-semibold');
      btnEl.classList.remove('bg-white', 'border', 'border-slate-200', 'text-slate-700', 'font-medium');
      renderKB(category);
    }

    function renderProviderCard(prov) {
      const isPCP = prov.category === 'Primary Care Provider';
      let roleLabel = isPCP ? 'Physician Assistant' : (prov.rules?.specialty || 'Specialist');
      if (prov.entity.includes('MD') && isPCP) roleLabel = 'Medical Doctor';

      const bullets = extractBulletLines(prov.content);
      const chips = renderStructuredChips(prov.rules);

      return `
        <div class="bg-white border border-slate-200 rounded-xl p-5 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <h3 class="text-base font-bold text-slate-900">${prov.entity}</h3>
              <span class="text-xs font-medium px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-700">${roleLabel}</span>
            </div>
            ${chips}
            <ul class="space-y-2 text-sm text-slate-700">
              ${bullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-slate-400 select-none">&bull;</span><span>${b}</span></li>`).join('')}
            </ul>
          </div>
        </div>
      `;
    }

    function renderProviders(locationFilter) {
      let pcps = kbRecords.filter(r => r.category === 'Primary Care Provider');
      let specs = kbRecords.filter(r => r.category === 'Specialist Provider');

      if (locationFilter !== 'ALL') {
        pcps = pcps.filter(p => p.content.toLowerCase().includes(locationFilter.toLowerCase()));
        specs = specs.filter(p => p.content.toLowerCase().includes(locationFilter.toLowerCase()));
      }

      document.getElementById('pcpCardsContainer').innerHTML = pcps.length
        ? pcps.map(renderProviderCard).join('')
        : '<p class="text-sm text-slate-500">No Primary Care Providers at this location.</p>';

      document.getElementById('specCardsContainer').innerHTML = specs.length
        ? specs.map(renderProviderCard).join('')
        : '<p class="text-sm text-slate-500">No Specialty Providers at this location.</p>';
    }

    function filterProviders(loc, btnEl) {
      document.querySelectorAll('.prov-pill').forEach(btn => {
        btn.classList.remove('brand-bg', 'text-white', 'font-semibold');
        btn.classList.add('bg-white', 'border', 'border-slate-200', 'text-slate-700', 'font-medium');
      });
      btnEl.classList.add('brand-bg', 'text-white', 'font-semibold');
      btnEl.classList.remove('bg-white', 'border', 'border-slate-200', 'text-slate-700', 'font-medium');
      renderProviders(loc);
    }

    function renderVisits() {
      const visits = kbRecords.filter(r => r.category === 'Visit Types');
      document.getElementById('visitsGridContainer').innerHTML = visits.map(v => {
        const bullets = extractBulletLines(v.content);
        const chips = renderStructuredChips(v.rules);
        return `
          <div class="bg-white border border-slate-200 rounded-xl p-5 flex flex-col justify-between">
            <div>
              <h3 class="text-base font-bold text-slate-900 mb-3">${v.entity}</h3>
              ${chips}
              <ul class="space-y-2 text-sm text-slate-700">
                ${bullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-slate-400 select-none">&bull;</span><span>${b}</span></li>`).join('')}
              </ul>
            </div>
          </div>`;
      }).join('');
    }

    async function executeSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      document.getElementById('clearSearchBtn').classList.remove('hidden');
      document.querySelectorAll('.content-section').forEach(el => el.classList.add('hidden'));
      const searchSec = document.getElementById('searchSection');
      const container = document.getElementById('searchResultsContainer');

      searchSec.classList.remove('hidden');
      container.innerHTML = '<div class="text-sm text-slate-500">Searching...</div>';

      const res = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, topK: 5 })
      });
      const data = await res.json();
      const results = data.results || [];

      if (!results.length) {
        container.innerHTML = '<div class="text-sm text-slate-500">No matching guidelines found.</div>';
        return;
      }

      container.innerHTML = results.map(item => {
        const bullets = extractBulletLines(item.content);
        const chips = renderStructuredChips(item.rules);
        return `
          <div class="bg-white border border-slate-200 rounded-xl p-5">
            <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3">
              <h3 class="text-base font-bold text-slate-900">${item.entity}</h3>
              <span class="text-xs text-slate-400">${item.category}</span>
            </div>
            ${chips}
            <ul class="space-y-2 text-sm text-slate-700">
              ${bullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-slate-400 select-none">&bull;</span><span>${b}</span></li>`).join('')}
            </ul>
          </div>`;
      }).join('');
    }

    function clearSearch(restore = true) {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('searchSection').classList.add('hidden');
      if (restore) document.getElementById(`section-${activeSection}`).classList.remove('hidden');
    }

    async function executeDecision() {
      const query = document.getElementById('askInput').value.trim();
      if (!query) return;

      const out = document.getElementById('decisionOutputContainer');

      // Show friendly notice if a future/pending department pill is currently selected
      if (selectedJewelDept !== 'internal_medicine') {
        const dept = DEPARTMENTS.find(d => d.id === selectedJewelDept);
        out.innerHTML = `
          <div class="bg-sky-50 border border-sky-200 text-slate-800 rounded-xl p-5 flex items-center gap-3.5">
            <img src="${dept.icon}" alt="" class="w-8 h-8 object-contain shrink-0" />
            <div>
              <div class="text-sm font-bold text-slate-900">${dept.name} Knowledge Base Pending</div>
              <p class="text-xs text-slate-600 mt-0.5">SOP rules for ${dept.name} are not indexed yet. Select <strong>Internal Medicine</strong> above to query active clinic rules.</p>
            </div>
          </div>
        `;
        return;
      }

      out.innerHTML = '<div class="text-sm text-slate-500">Checking clinic rules...</div>';

      try {
        const res = await fetch('/decide', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        if (!res.ok) throw new Error('Service unavailable');
        const data = await res.json();

        let primaryCardHtml = '';

        // 1. Direct Fact Card (Inline Confidence + Copy Button inside the box)
        if (data.mode === 'fact_lookup' && data.direct_fact) {
          const safeAns = data.direct_fact.answer.replace(/'/g, "\\'");
          const conf = formatPct(data.direct_fact.confidence);
          primaryCardHtml = `
            <div class="flex items-center justify-between gap-4 bg-sky-50/80 border border-sky-200 rounded-xl px-5 py-4">
              <div class="text-lg font-bold text-slate-900 font-mono">${data.direct_fact.answer}</div>
              <div class="flex items-center gap-3 shrink-0">
                <span class="text-xs font-mono font-medium px-2.5 py-1 rounded bg-sky-100/80 text-sky-900">Confidence: ${conf}</span>
                <button onclick="copyText('${safeAns}', this)" class="brand-bg brand-bg-hover text-white text-xs font-medium px-3.5 py-1.5 rounded-md transition">
                  Copy
                </button>
              </div>
            </div>
          `;
        }
        // 2. Yes/No Gate Card (Inline Confidence in top-right corner of the box)
        else if (data.mode === 'yes_no_gate' && data.yes_no_gate) {
          const yn = data.yes_no_gate.decision || '';
          const conf = formatPct(data.yes_no_gate.confidence);
          let boxStyle = 'bg-emerald-50 text-emerald-950 border-emerald-200';
          let badgeStyle = 'bg-emerald-100 text-emerald-900';

          if (yn.startsWith('NO')) {
            boxStyle = 'bg-rose-50 text-rose-950 border-rose-200';
            badgeStyle = 'bg-rose-100 text-rose-900';
          } else if (yn.startsWith('CONDITIONAL')) {
            boxStyle = 'bg-amber-50 text-amber-950 border-amber-200';
            badgeStyle = 'bg-amber-100 text-amber-900';
          }

          primaryCardHtml = `
            <div class="p-5 rounded-xl border ${boxStyle}">
              <div class="flex items-center justify-between gap-3">
                <div class="text-base font-bold">${yn}</div>
                <span class="text-xs font-mono font-medium px-2.5 py-0.5 rounded shrink-0 ${badgeStyle}">Confidence: ${conf}</span>
              </div>
              <p class="text-sm mt-1.5 leading-relaxed">${data.yes_no_gate.explanation}</p>
            </div>
          `;
        }
        // 3. Queue Routing Card (Inline Confidence in top-right corner of the box)
        else if (data.mode === 'queue_routing' && data.routing_classification) {
          const rc = data.routing_classification;
          const conf = formatPct(rc.confidence);
          primaryCardHtml = `
            <div class="p-5 rounded-xl bg-sky-50/80 border border-sky-200 flex items-center justify-between gap-4">
              <div class="text-base font-bold text-slate-900">${rc.action}</div>
              <span class="text-xs font-mono font-medium px-2.5 py-0.5 rounded bg-sky-100/80 text-sky-900 shrink-0">Confidence: ${conf}</span>
            </div>
          `;
        }

        const srcBullets = extractBulletLines(data.matched_source.content);
        const srcChips = renderStructuredChips(data.matched_source.rules);

        out.innerHTML = `
          <div class="space-y-5">
            ${primaryCardHtml}

            <div class="space-y-2 pt-1">
              <div class="flex items-center gap-2 text-xs font-semibold text-slate-500 px-1">
                <svg class="w-3.5 h-3.5 text-sky-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Source &amp; Reference Guideline</span>
              </div>

              <div class="bg-white border border-slate-200 rounded-xl p-5">
                <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3">
                  <h3 class="text-base font-bold text-slate-900">${data.matched_source.entity}</h3>
                  <span class="text-xs text-slate-400">${data.matched_source.category}</span>
                </div>
                ${srcChips}
                <ul class="space-y-2 text-sm text-slate-700">
                  ${srcBullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-slate-400 select-none">&bull;</span><span>${b}</span></li>`).join('')}
                </ul>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        out.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-xl p-4 text-sm">
            Jewel is currently unavailable. Please use the top Search bar or contact IT support.
          </div>
        `;
      }
    }

    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeSearch();
    });
    document.getElementById('askInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeDecision();
    });

    loadKB();
  </script>
</body>
</html>
