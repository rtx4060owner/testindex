<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aizer Health — Call Center Operations</title>
  <link rel="icon" type="image/avif" href="/AizerLogo.avif" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F7F8FA;
      color: #1B2433;
    }

    /* Brand Tokens */
    .brand-navy-bg { background-color: #0F2A4A; }
    .brand-navy-bg-hover:hover { background-color: #173B66; }
    .brand-accent-bg { background-color: #1565C0; }
    .brand-accent-bg-hover:hover { background-color: #104FA0; }
    .brand-accent-text { color: #1565C0; }
    .brand-soft-bg { background-color: #E8F2FC; }

    /* Horizontal Cards Rail */
    .dept-rail {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 14px;
    }
    .dept-rail::-webkit-scrollbar {
      height: 8px;
    }
    .dept-rail::-webkit-scrollbar-track {
      background: transparent;
    }
    .dept-rail::-webkit-scrollbar-thumb {
      background-color: #C9D1DC;
      border-radius: 8px;
    }
    .dept-rail::-webkit-scrollbar-thumb:hover {
      background-color: #AEB9C8;
    }

    /* Vertical Portrait Department Card (280x480) */
    .dept-card {
      flex: 0 0 280px;
      width: 280px;
      height: 480px;
      background-color: #FFFFFF;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      scroll-snap-align: start;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .dept-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(15, 42, 74, 0.10);
    }
    .dept-card--active {
      border: 2px solid #1565C0;
    }
    .dept-card--inactive {
      border: 1px solid #E6EAF0;
    }

    /* Top 52% Illustration Area with Dotted Tint */
    .dept-card-media {
      position: relative;
      height: 52%;
      width: 100%;
      overflow: hidden;
      flex-shrink: 0;
    }
    .dept-card--active .dept-card-media {
      background-color: #E8F2FC;
      background-image: radial-gradient(#C5DCF5 1.2px, transparent 1.2px);
      background-size: 16px 16px;
    }
    .dept-card--inactive .dept-card-media {
      background-color: #F2F4F7;
      background-image: radial-gradient(#DCE1E8 1.2px, transparent 1.2px);
      background-size: 16px 16px;
    }

    /* Centered 104x104 Icon Tile */
    .dept-icon-tile {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 104px;
      height: 104px;
      border-radius: 28px;
      background-color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(15, 42, 74, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dept-icon-tile--with-image {
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 10px 28px rgba(15, 42, 74, 0.18);
    }

    /* Screen-reader only utility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header (Max-width 1360px, horizontal padding 40px) -->
  <header class="bg-white border-b border-[#E6EAF0] sticky top-0 z-30">
    <div class="max-w-[1360px] mx-auto px-5 sm:px-[40px]">
      <div class="flex flex-wrap lg:flex-nowrap items-center justify-between gap-4 min-h-[68px] py-2.5">

        <!-- Left Side: Logo + Navigation Links -->
        <div class="flex items-center gap-5 min-w-0">
          <button onclick="switchSection('home')" title="Clinical Departments" class="flex items-center cursor-pointer shrink-0 focus:outline-none">
            <img
              src="/AizerLogo.avif"
              alt="Aizer Health"
              class="h-7 w-auto object-contain"
              onerror="this.style.display='none'; document.getElementById('fallbackLogo').classList.remove('hidden');"
            />
            <div id="fallbackLogo" class="hidden w-8 h-8 rounded-[10px] brand-navy-bg flex items-center justify-center text-white shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12h4l3-7 4 14 3-7h4" />
              </svg>
            </div>
          </button>

          <div class="h-5 w-px bg-[#E6EAF0] hidden md:block shrink-0"></div>

          <nav class="flex items-center gap-1 overflow-x-auto md:overflow-visible">
            <button id="nav-kb" onclick="switchSection('kb')" class="nav-item flex items-center gap-1.5 px-3 py-2 rounded-[10px] text-sm font-medium transition brand-soft-bg brand-accent-text whitespace-nowrap shrink-0">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
              </svg>
              <span>Knowledge Base</span>
            </button>

            <button id="nav-providers" onclick="switchSection('providers')" class="nav-item flex items-center gap-1.5 px-3 py-2 rounded-[10px] text-sm font-medium text-[#4F5A6B] hover:bg-slate-50 transition whitespace-nowrap shrink-0">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span>Providers</span>
            </button>

            <button id="nav-visits" onclick="switchSection('visits')" class="nav-item flex items-center gap-1.5 px-3 py-2 rounded-[10px] text-sm font-medium text-[#4F5A6B] hover:bg-slate-50 transition whitespace-nowrap shrink-0">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span>Visit Types</span>
            </button>

            <div class="h-4 w-px bg-[#E6EAF0] mx-1 shrink-0"></div>

            <button id="nav-assistant" onclick="switchSection('assistant')" class="nav-item flex items-center gap-1.5 px-3 py-2 rounded-[10px] text-sm font-medium text-[#4F5A6B] hover:bg-slate-50 transition whitespace-nowrap shrink-0">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
              </svg>
              <span>Ask Jewel</span>
            </button>
          </nav>
        </div>

        <!-- Right Side: Search Input (44px tall, 10px radius) + Navy Search Button -->
        <div class="flex items-center gap-2 w-full sm:w-auto sm:min-w-[280px] xl:min-w-[320px] shrink-0">
          <div class="relative flex-1">
            <label for="searchInput" class="sr-only">Search guidelines</label>
            <svg class="w-4 h-4 text-[#5B6576] absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z" />
            </svg>
            <input
              id="searchInput"
              type="text"
              placeholder="Search guidelines..."
              class="w-full h-[44px] pl-10 pr-12 bg-white border border-[#D5DBE3] rounded-[10px] text-sm text-[#0F1B2D] placeholder-[#5B6576] focus:outline-none focus:ring-2 focus:ring-[#1565C0] focus:border-transparent transition"
            />
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-xs text-[#5B6576] hover:text-[#0F1B2D] font-medium">
              Clear
            </button>
          </div>
          <button onclick="executeSearch()" class="h-[44px] brand-navy-bg brand-navy-bg-hover text-white text-sm font-semibold px-4 rounded-[10px] transition shrink-0">
            Search
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Workspace (Max-width 1360px, 40px top, 40px sides, 64px bottom) -->
  <main class="max-w-[1360px] mx-auto w-full flex-1 pt-[40px] px-5 sm:px-[40px] pb-[64px]">
    <div id="loadingIndicator" class="text-sm text-[#5B6576] py-10">Loading guidelines...</div>

    <!-- HOME VIEW: CLINICAL DEPARTMENTS (Vertical Portrait Cards Rail) -->
    <section id="section-home" class="content-section hidden">
      <!-- Title Row -->
      <div class="flex flex-wrap items-end justify-between gap-4 border-b border-[#E6EAF0] pb-[24px] mb-[28px]">
        <div>
          <h1 class="text-[32px] font-bold text-[#0F1B2D] tracking-[-0.5px] leading-tight">Clinical Departments</h1>
          <p class="text-[16px] text-[#4F5A6B] mt-1">Select a department to access scheduling guidelines, providers, and rules.</p>
        </div>

        <!-- Previous / Next Rail Controls (44x44) -->
        <div class="flex items-center gap-2.5 shrink-0">
          <button
            type="button"
            onclick="scrollDeptRail(-1)"
            aria-label="Previous departments"
            class="w-[44px] h-[44px] rounded-full bg-white border border-[#D5DBE3] hover:bg-slate-50 flex items-center justify-center text-[#0F2A4A] transition cursor-pointer"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 12H5M11 6l-6 6 6 6"/>
            </svg>
          </button>
          <button
            type="button"
            onclick="scrollDeptRail(1)"
            aria-label="Next departments"
            class="w-[44px] h-[44px] rounded-full bg-[#0F2A4A] hover:bg-[#173B66] flex items-center justify-center text-white transition cursor-pointer"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Horizontal Cards Rail -->
      <div id="homeDepartmentsRail" class="dept-rail"></div>
    </section>

    <!-- SEARCH RESULTS VIEW -->
    <section id="searchSection" class="hidden space-y-5">
      <div class="flex items-center justify-between border-b border-[#E6EAF0] pb-3">
        <h1 class="text-xl font-bold text-[#0F1B2D]">Search Results</h1>
        <button onclick="clearSearch()" class="text-xs font-medium text-[#4F5A6B] hover:text-[#0F1B2D]">
          &larr; Back
        </button>
      </div>
      <div id="searchResultsContainer" class="space-y-4"></div>
    </section>

    <!-- SECTION 1: KNOWLEDGE BASE -->
    <section id="section-kb" class="content-section hidden space-y-5">
      <div class="flex items-center gap-2.5">
        <svg class="w-6 h-6 text-[#1565C0]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3v5a5 5 0 0 0 10 0V3"/><path d="M10 13v3a4 4 0 0 0 8 0v-2"/><circle cx="18" cy="12" r="2"/>
        </svg>
        <h1 class="text-2xl font-bold text-[#0F1B2D]">Internal Medicine — Knowledge Base</h1>
      </div>

      <div id="kbPills" class="flex items-center gap-2 overflow-x-auto pb-1">
        <button onclick="filterKB('ALL', this)" class="kb-pill px-3.5 py-1.5 rounded-[10px] text-xs font-semibold brand-navy-bg text-white whitespace-nowrap transition">All</button>
        <button onclick="filterKB('Core Scheduling Rules', this)" class="kb-pill px-3.5 py-1.5 rounded-[10px] text-xs font-medium bg-white border border-[#E6EAF0] text-[#4F5A6B] hover:bg-slate-50 whitespace-nowrap transition">Core Scheduling Rules</button>
        <button onclick="filterKB('Directory & Locations', this)" class="kb-pill px-3.5 py-1.5 rounded-[10px] text-xs font-medium bg-white border border-[#E6EAF0] text-[#4F5A6B] hover:bg-slate-50 whitespace-nowrap transition">Directory & Locations</button>
        <button onclick="filterKB('Nurse & Lab Services', this)" class="kb-pill px-3.5 py-1.5 rounded-[10px] text-xs font-medium bg-white border border-[#E6EAF0] text-[#4F5A6B] hover:bg-slate-50 whitespace-nowrap transition">Nurse & Lab Services</button>
        <button onclick="filterKB('Telephone Encounter (TE) Routing', this)" class="kb-pill px-3.5 py-1.5 rounded-[10px] text-xs font-medium bg-white border border-[#E6EAF0] text-[#4F5A6B] hover:bg-slate-50 whitespace-nowrap transition">TE Routing</button>
        <button onclick="filterKB('Referrals & Prior Authorizations', this)" class="kb-pill px-3.5 py-1.5 rounded-[10px] text-xs font-medium bg-white border border-[#E6EAF0] text-[#4F5A6B] hover:bg-slate-50 whitespace-nowrap transition">Referrals & Auth</button>
        <button onclick="filterKB('Special Operational Policies', this)" class="kb-pill px-3.5 py-1.5 rounded-[10px] text-xs font-medium bg-white border border-[#E6EAF0] text-[#4F5A6B] hover:bg-slate-50 whitespace-nowrap transition">Special Policies</button>
      </div>

      <div id="kbCardsContainer" class="space-y-4"></div>
    </section>

    <!-- SECTION 2: PROVIDERS & SPECIALISTS -->
    <section id="section-providers" class="content-section hidden space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h1 class="text-2xl font-bold text-[#0F1B2D]">Providers & Specialists</h1>
        <div class="flex gap-2">
          <button onclick="filterProviders('ALL', this)" class="prov-pill px-3.5 py-1.5 rounded-[10px] text-xs font-semibold brand-navy-bg text-white">All Locations</button>
          <button onclick="filterProviders('Bakertown', this)" class="prov-pill px-3.5 py-1.5 rounded-[10px] text-xs font-medium bg-white border border-[#E6EAF0] text-[#4F5A6B] hover:bg-slate-50">Bakertown (3rd Fl)</button>
          <button onclick="filterProviders('Forest Rd', this)" class="prov-pill px-3.5 py-1.5 rounded-[10px] text-xs font-medium bg-white border border-[#E6EAF0] text-[#4F5A6B] hover:bg-slate-50">Forest Rd (2nd Fl)</button>
        </div>
      </div>

      <div class="space-y-3">
        <h2 class="text-sm font-semibold text-[#5B6576]">Primary Care Providers</h2>
        <div id="pcpCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <div class="space-y-3 pt-2">
        <h2 class="text-sm font-semibold text-[#5B6576]">Specialty Providers</h2>
        <div id="specCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <!-- SECTION 3: TYPES OF VISITS -->
    <section id="section-visits" class="content-section hidden space-y-5">
      <h1 class="text-2xl font-bold text-[#0F1B2D]">Types of Visits</h1>
      <div id="visitsGridContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- SECTION 4: ASK JEWEL -->
    <section id="section-assistant" class="content-section hidden space-y-5 max-w-4xl">
      <div class="bg-white border border-[#E6EAF0] rounded-[16px] p-5 space-y-3.5">
        <div class="flex flex-col sm:flex-row gap-3">
          <label for="askInput" class="sr-only">Ask Jewel a question</label>
          <input
            id="askInput"
            type="text"
            placeholder="Ask Jewel about Internal Medicine eligibility, routing, or policies..."
            class="flex-1 h-[44px] px-4 bg-[#F7F8FA] border border-[#D5DBE3] rounded-[10px] text-sm text-[#0F1B2D] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1565C0] focus:border-transparent transition"
          />
          <button onclick="executeDecision()" class="h-[44px] brand-navy-bg brand-navy-bg-hover text-white text-sm font-semibold px-6 rounded-[10px] transition shrink-0">
            Jewel it
          </button>
        </div>

        <!-- Department Selector Pills -->
        <div id="jewelDeptSelector" class="flex flex-wrap items-center gap-2 pt-0.5"></div>
      </div>

      <div id="decisionOutputContainer"></div>
    </section>

  </main>

  <script>
    let kbRecords = [];
    let activeSection = 'kb';
    let selectedJewelDept = 'internal_medicine';

    const ICON_SVGS = {
      stethoscope: `<path d="M5 3v5a5 5 0 0 0 10 0V3"/><path d="M10 13v3a4 4 0 0 0 8 0v-2"/><circle cx="18" cy="12" r="2"/>`,
      heart_pulse: `<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/><path d="M3.5 12h4l2-3 3 6 2-3h6"/>`,
      brain: `<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3 3 3 0 0 0 3-3V7a3 3 0 0 0-3-3z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3 3 3 0 0 1-3-3"/>`,
      cube: `<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>`,
      foot: `<path d="M8 3c-1 4-2 8-1 12 .5 2.5 2.5 5 5.5 5H19a2 2 0 0 0 0-4h-3c-2 0-3.2-1.2-3.6-3.2L11 3"/>`,
      eye: `<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>`,
      female: `<circle cx="12" cy="9" r="5"/><path d="M12 14v7M9 18h6"/>`,
      arrow_right: `<path d="M5 12h14M13 6l6 6-6 6"/>`
    };

    const DEPARTMENTS = [
      {
        id: 'internal_medicine',
        title: 'Internal Medicine',
        description: 'Adult Primary Care, Specialty Referrals & Scheduling SOPs',
        image: null,
        alt: 'Internal Medicine clinic illustration',
        icon: 'stethoscope',
        isActive: true
      },
      {
        id: 'acute_care',
        title: 'Acute Care',
        description: 'Walk-in Urgent Visits & Same-Day Triage',
        image: null,
        alt: 'Acute Care clinic illustration',
        icon: 'heart_pulse',
        isActive: false
      },
      {
        id: 'behavioral_health',
        title: 'Behavioral Health',
        description: 'Psychiatry, Counseling & Therapy Scheduling',
        image: null,
        alt: 'Behavioral Health clinic illustration',
        icon: 'brain',
        isActive: false
      },
      {
        id: 'pediatrics',
        title: 'Pediatrics',
        description: 'Well-Child Exams, Immunizations & Sick Visits',
        image: null,
        alt: 'Pediatric clinic illustration',
        icon: 'cube',
        isActive: false
      },
      {
        id: 'podiatry',
        title: 'Podiatry',
        description: 'Foot & Ankle Care, Diabetic Foot Exams',
        image: null,
        alt: 'Podiatry clinic illustration',
        icon: 'foot',
        isActive: false
      },
      {
        id: 'vision',
        title: 'Vision',
        description: 'Optometry, Eye Exams & Optical Services',
        image: null,
        alt: 'Vision clinic illustration',
        icon: 'eye',
        isActive: false
      },
      {
        id: 'womens_health',
        title: "Women's Health",
        description: 'OB/GYN Care, Prenatal & Preventative Screenings',
        image: null,
        alt: "Women's Health clinic illustration",
        icon: 'female',
        isActive: false
      }
    ];

    function renderHomeDepartments() {
      const rail = document.getElementById('homeDepartmentsRail');
      rail.innerHTML = DEPARTMENTS.map(dept => {
        const cardStateClass = dept.isActive ? 'dept-card--active' : 'dept-card--inactive';
        const iconColor = dept.isActive ? '#1565C0' : '#0F2A4A';
        const tileImageClass = dept.image ? 'dept-icon-tile--with-image' : '';

        const imageMarkup = dept.image
          ? `<img src="${dept.image}" alt="${dept.alt}" class="absolute inset-0 w-full h-full object-cover" />`
          : '';

        const titleMarkup = dept.isActive
          ? `<h2 class="text-[22px] font-extrabold text-[#0F1B2D] tracking-[-0.3px] leading-snug">${dept.title}</h2>`
          : `<h2 class="text-[22px] font-bold text-[#3A4556] tracking-[-0.3px] leading-snug">${dept.title}</h2>`;

        const descColor = dept.isActive ? 'text-[#4F5A6B]' : 'text-[#5B6576]';

        const statusMarkup = dept.isActive
          ? `<div class="text-[13px] font-medium text-[#0F6B3E]">SOP data available</div>`
          : `<div class="text-[13px] text-[#5B6576]">SOP data pending</div>`;

        const ctaMarkup = dept.isActive
          ? `<a href="#internal-medicine" onclick="event.preventDefault(); switchSection('kb');" class="w-full h-[48px] rounded-full bg-[#1565C0] hover:bg-[#104FA0] text-white font-bold text-[15px] flex items-center justify-center gap-2 transition mt-1">
               <span>Open Guidelines</span>
               <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">${ICON_SVGS.arrow_right}</svg>
             </a>`
          : `<button type="button" disabled class="w-full h-[48px] rounded-full bg-[#F7F8FA] border border-[#DDE2E9] text-[#5B6576] font-medium text-[15px] flex items-center justify-center cursor-not-allowed mt-1">
               Not available yet
             </button>`;

        return `
          <article class="dept-card ${cardStateClass}">
            <div class="dept-card-media">
              ${imageMarkup}
              <div class="dept-icon-tile ${tileImageClass}">
                <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="${iconColor}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  ${ICON_SVGS[dept.icon]}
                </svg>
              </div>
            </div>

            <div class="flex-1 flex flex-col gap-[8px] pt-[20px] px-[22px] pb-[22px]">
              ${titleMarkup}
              <p class="text-[14px] leading-[1.5] ${descColor}">${dept.description}</p>
              <div class="flex-1"></div>
              ${statusMarkup}
              ${ctaMarkup}
            </div>
          </article>
        `;
      }).join('');
    }

    function scrollDeptRail(direction) {
      const rail = document.getElementById('homeDepartmentsRail');
      const card = rail.querySelector('.dept-card');
      const cardWidth = card ? card.offsetWidth : 280;
      rail.scrollBy({
        left: direction * (cardWidth + 20),
        behavior: 'smooth'
      });
    }

    function renderJewelDeptSelector() {
      const container = document.getElementById('jewelDeptSelector');
      container.innerHTML = DEPARTMENTS.map(dept => {
        const isSelected = dept.id === selectedJewelDept;
        const btnClasses = isSelected
          ? 'bg-[#E8F2FC] border-[#1565C0] text-[#0F2A4A] font-semibold'
          : 'bg-[#F7F8FA] border-[#E6EAF0] text-[#5B6576] hover:bg-slate-100 hover:text-[#1B2433] opacity-75 hover:opacity-100';
        const strokeColor = isSelected ? '#1565C0' : '#0F2A4A';

        return `
          <button
            type="button"
            onclick="selectJewelDepartment('${dept.id}')"
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-[10px] border text-xs transition ${btnClasses}"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${strokeColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              ${ICON_SVGS[dept.icon]}
            </svg>
            <span>${dept.title}</span>
          </button>
        `;
      }).join('');
    }

    function selectJewelDepartment(deptId) {
      selectedJewelDept = deptId;
      renderJewelDeptSelector();
      const dept = DEPARTMENTS.find(d => d.id === deptId);
      const input = document.getElementById('askInput');
      if (dept) {
        input.placeholder = `Ask Jewel about ${dept.title} eligibility, routing, or policies...`;
      }
    }

    function extractBulletLines(content) {
      if (!content) return [];
      const protectedText = content.replace(
        /\b(Dr|Mr|Mrs|Ms|Ext|St|Rd|Ave|vs|e\.g|i\.e|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\./gi,
        '$1__DOT__'
      );
      return protectedText
        .split(/\.\s+/)
        .map(s => s.replace(/__DOT__/g, '.').trim())
        .filter(s => s.length > 2)
        .map(s => (s.endsWith('.') || s.endsWith(':') ? s : s + '.'));
    }

    function renderStructuredChips(rules) {
      if (!rules || typeof rules !== 'object') return '';
      const entries = Object.entries(rules);
      if (!entries.length) return '';

      return `
        <div class="flex flex-wrap gap-1.5 mb-3.5">
          ${entries.map(([key, val]) => {
            const cleanKey = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            let cleanVal = '';
            if (Array.isArray(val)) cleanVal = val.join(', ');
            else if (typeof val === 'object' && val !== null) {
              cleanVal = Object.entries(val).map(([k, v]) => `${k}: ${v}`).join(' | ');
            } else if (typeof val === 'boolean') {
              cleanVal = val ? 'Yes' : 'No';
            } else {
              cleanVal = String(val);
            }

            let chipStyle = 'bg-[#F7F8FA] text-[#1B2433] border-[#E6EAF0]';
            if (val === false || String(val).toLowerCase().includes('only')) {
              chipStyle = 'bg-rose-50 text-rose-800 border-rose-200';
            } else if (key.includes('fee') || key.includes('code') || key.includes('queue')) {
              chipStyle = 'bg-[#E8F2FC] text-[#0F2A4A] border-[#C5DCF5]';
            }

            return `<span class="inline-flex items-center gap-1 text-xs px-2.5 py-0.5 rounded-md border ${chipStyle}">
              <span class="font-medium opacity-75">${cleanKey}:</span>
              <span class="font-semibold">${cleanVal}</span>
            </span>`;
          }).join('')}
        </div>
      `;
    }

    function formatPct(val) {
      return `${(Number(val || 0) * 100).toFixed(0)}%`;
    }

    function copyText(text, btnEl) {
      navigator.clipboard.writeText(text);
      const original = btnEl.innerHTML;
      btnEl.innerText = 'Copied!';
      setTimeout(() => { btnEl.innerHTML = original; }, 1400);
    }

    async function loadKB() {
      renderHomeDepartments();
      renderJewelDeptSelector();
      try {
        const res = await fetch('/kb');
        const data = await res.json();
        kbRecords = data.items || [];
        document.getElementById('loadingIndicator').classList.add('hidden');
        renderKB('ALL');
        renderProviders('ALL');
        renderVisits();
        switchSection('kb');
      } catch (e) {
        document.getElementById('loadingIndicator').innerText = 'Unable to load guidelines right now.';
      }
    }

    function switchSection(section) {
      activeSection = section;
      clearSearch(false);
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.remove('brand-soft-bg', 'brand-accent-text');
        el.classList.add('text-[#4F5A6B]', 'hover:bg-slate-50');
      });

      const currentNav = document.getElementById(`nav-${section}`);
      if (currentNav) {
        currentNav.classList.add('brand-soft-bg', 'brand-accent-text');
        currentNav.classList.remove('text-[#4F5A6B]', 'hover:bg-slate-50');
      }

      document.querySelectorAll('.content-section').forEach(el => el.classList.add('hidden'));
      document.getElementById(`section-${section}`).classList.remove('hidden');
    }

    function renderKB(category) {
      const kbCategories = [
        'Core Scheduling Rules', 'Directory & Locations', 'Nurse & Lab Services',
        'Telephone Encounter (TE) Routing', 'Referrals & Prior Authorizations', 'Special Operational Policies'
      ];
      let list = kbRecords.filter(r => kbCategories.includes(r.category));
      if (category !== 'ALL') list = list.filter(r => r.category === category);

      document.getElementById('kbCardsContainer').innerHTML = list.map(item => {
        const bullets = extractBulletLines(item.content);
        const chips = renderStructuredChips(item.rules);
        return `
          <div class="bg-white border border-[#E6EAF0] rounded-[16px] p-5">
            <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3">
              <h3 class="text-base font-bold text-[#0F1B2D]">${item.entity}</h3>
              <span class="text-xs text-[#5B6576]">${item.category}</span>
            </div>
            ${chips}
            <ul class="space-y-2 text-sm text-[#1B2433]">
              ${bullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-[#5B6576] select-none">&bull;</span><span>${b}</span></li>`).join('')}
            </ul>
          </div>`;
      }).join('');
    }

    function filterKB(category, btnEl) {
      document.querySelectorAll('.kb-pill').forEach(btn => {
        btn.classList.remove('brand-navy-bg', 'text-white', 'font-semibold');
        btn.classList.add('bg-white', 'border', 'border-[#E6EAF0]', 'text-[#4F5A6B]', 'font-medium');
      });
      btnEl.classList.add('brand-navy-bg', 'text-white', 'font-semibold');
      btnEl.classList.remove('bg-white', 'border', 'border-[#E6EAF0]', 'text-[#4F5A6B]', 'font-medium');
      renderKB(category);
    }

    function renderProviderCard(prov) {
      const isPCP = prov.category === 'Primary Care Provider';
      let roleLabel = isPCP ? 'Physician Assistant' : (prov.rules?.specialty || 'Specialist');
      if (prov.entity.includes('MD') && isPCP) roleLabel = 'Medical Doctor';

      const bullets = extractBulletLines(prov.content);
      const chips = renderStructuredChips(prov.rules);

      return `
        <div class="bg-white border border-[#E6EAF0] rounded-[16px] p-5 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <h3 class="text-base font-bold text-[#0F1B2D]">${prov.entity}</h3>
              <span class="text-xs font-medium px-2.5 py-0.5 rounded-md bg-[#F7F8FA] border border-[#E6EAF0] text-[#4F5A6B]">${roleLabel}</span>
            </div>
            ${chips}
            <ul class="space-y-2 text-sm text-[#1B2433]">
              ${bullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-[#5B6576] select-none">&bull;</span><span>${b}</span></li>`).join('')}
            </ul>
          </div>
        </div>
      `;
    }

    function renderProviders(locationFilter) {
      let pcps = kbRecords.filter(r => r.category === 'Primary Care Provider');
      let specs = kbRecords.filter(r => r.category === 'Specialist Provider');

      if (locationFilter !== 'ALL') {
        pcps = pcps.filter(p => p.content.toLowerCase().includes(locationFilter.toLowerCase()));
        specs = specs.filter(p => p.content.toLowerCase().includes(locationFilter.toLowerCase()));
      }

      document.getElementById('pcpCardsContainer').innerHTML = pcps.length
        ? pcps.map(renderProviderCard).join('')
        : '<p class="text-sm text-[#5B6576]">No Primary Care Providers at this location.</p>';

      document.getElementById('specCardsContainer').innerHTML = specs.length
        ? specs.map(renderProviderCard).join('')
        : '<p class="text-sm text-[#5B6576]">No Specialty Providers at this location.</p>';
    }

    function filterProviders(loc, btnEl) {
      document.querySelectorAll('.prov-pill').forEach(btn => {
        btn.classList.remove('brand-navy-bg', 'text-white', 'font-semibold');
        btn.classList.add('bg-white', 'border', 'border-[#E6EAF0]', 'text-[#4F5A6B]', 'font-medium');
      });
      btnEl.classList.add('brand-navy-bg', 'text-white', 'font-semibold');
      btnEl.classList.remove('bg-white', 'border', 'border-[#E6EAF0]', 'text-[#4F5A6B]', 'font-medium');
      renderProviders(loc);
    }

    function renderVisits() {
      const visits = kbRecords.filter(r => r.category === 'Visit Types');
      document.getElementById('visitsGridContainer').innerHTML = visits.map(v => {
        const bullets = extractBulletLines(v.content);
        const chips = renderStructuredChips(v.rules);
        return `
          <div class="bg-white border border-[#E6EAF0] rounded-[16px] p-5 flex flex-col justify-between">
            <div>
              <h3 class="text-base font-bold text-[#0F1B2D] mb-3">${v.entity}</h3>
              ${chips}
              <ul class="space-y-2 text-sm text-[#1B2433]">
                ${bullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-[#5B6576] select-none">&bull;</span><span>${b}</span></li>`).join('')}
              </ul>
            </div>
          </div>`;
      }).join('');
    }

    async function executeSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      document.getElementById('clearSearchBtn').classList.remove('hidden');
      document.querySelectorAll('.content-section').forEach(el => el.classList.add('hidden'));
      const searchSec = document.getElementById('searchSection');
      const container = document.getElementById('searchResultsContainer');

      searchSec.classList.remove('hidden');
      container.innerHTML = '<div class="text-sm text-[#5B6576]">Searching...</div>';

      const res = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, topK: 5 })
      });
      const data = await res.json();
      const results = data.results || [];

      if (!results.length) {
        container.innerHTML = '<div class="text-sm text-[#5B6576]">No matching guidelines found.</div>';
        return;
      }

      container.innerHTML = results.map(item => {
        const bullets = extractBulletLines(item.content);
        const chips = renderStructuredChips(item.rules);
        return `
          <div class="bg-white border border-[#E6EAF0] rounded-[16px] p-5">
            <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3">
              <h3 class="text-base font-bold text-[#0F1B2D]">${item.entity}</h3>
              <span class="text-xs text-[#5B6576]">${item.category}</span>
            </div>
            ${chips}
            <ul class="space-y-2 text-sm text-[#1B2433]">
              ${bullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-[#5B6576] select-none">&bull;</span><span>${b}</span></li>`).join('')}
            </ul>
          </div>`;
      }).join('');
    }

    function clearSearch(restore = true) {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('searchSection').classList.add('hidden');
      if (restore) document.getElementById(`section-${activeSection}`).classList.remove('hidden');
    }

    async function executeDecision() {
      const query = document.getElementById('askInput').value.trim();
      if (!query) return;

      const out = document.getElementById('decisionOutputContainer');

      if (selectedJewelDept !== 'internal_medicine') {
        const dept = DEPARTMENTS.find(d => d.id === selectedJewelDept);
        out.innerHTML = `
          <div class="bg-[#E8F2FC] border border-[#C5DCF5] text-[#0F1B2D] rounded-[16px] p-5 flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center shrink-0">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1565C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                ${ICON_SVGS[dept.icon]}
              </svg>
            </div>
            <div>
              <div class="text-sm font-bold text-[#0F1B2D]">${dept.title} Knowledge Base Pending</div>
              <p class="text-xs text-[#4F5A6B] mt-0.5">SOP rules for ${dept.title} are not indexed yet. Select <strong>Internal Medicine</strong> above to query active clinic rules.</p>
            </div>
          </div>
        `;
        return;
      }

      out.innerHTML = '<div class="text-sm text-[#5B6576]">Checking clinic rules...</div>';

      try {
        const res = await fetch('/decide', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        if (!res.ok) throw new Error('Service unavailable');
        const data = await res.json();

        let primaryCardHtml = '';

        // 1. Direct Fact Card
        if (data.mode === 'fact_lookup' && data.direct_fact) {
          const safeAns = data.direct_fact.answer.replace(/'/g, "\\'");
          const conf = formatPct(data.direct_fact.confidence);
          primaryCardHtml = `
            <div class="flex items-center justify-between gap-4 bg-[#E8F2FC] border border-[#C5DCF5] rounded-[16px] px-5 py-4">
              <div class="text-lg font-bold text-[#0F1B2D] font-mono">${data.direct_fact.answer}</div>
              <div class="flex items-center gap-3 shrink-0">
                <span class="text-xs font-mono font-medium px-2.5 py-1 rounded bg-white/80 text-[#0F2A4A]">Confidence: ${conf}</span>
                <button onclick="copyText('${safeAns}', this)" class="brand-navy-bg brand-navy-bg-hover text-white text-xs font-medium px-3.5 py-1.5 rounded-[10px] transition">
                  Copy
                </button>
              </div>
            </div>
          `;
        }
        // 2. Yes/No Gate Card
        else if (data.mode === 'yes_no_gate' && data.yes_no_gate) {
          const yn = data.yes_no_gate.decision || '';
          const conf = formatPct(data.yes_no_gate.confidence);
          let boxStyle = 'bg-emerald-50 text-emerald-950 border-emerald-200';
          let badgeStyle = 'bg-emerald-100 text-emerald-900';

          if (yn.startsWith('NO')) {
            boxStyle = 'bg-rose-50 text-rose-950 border-rose-200';
            badgeStyle = 'bg-rose-100 text-rose-900';
          } else if (yn.startsWith('CONDITIONAL')) {
            boxStyle = 'bg-amber-50 text-amber-950 border-amber-200';
            badgeStyle = 'bg-amber-100 text-amber-900';
          }

          primaryCardHtml = `
            <div class="p-5 rounded-[16px] border ${boxStyle}">
              <div class="flex items-center justify-between gap-3">
                <div class="text-base font-bold">${yn}</div>
                <span class="text-xs font-mono font-medium px-2.5 py-0.5 rounded shrink-0 ${badgeStyle}">Confidence: ${conf}</span>
              </div>
              <p class="text-sm mt-1.5 leading-relaxed">${data.yes_no_gate.explanation}</p>
            </div>
          `;
        }
        // 3. Queue Routing Card
        else if (data.mode === 'queue_routing' && data.routing_classification) {
          const rc = data.routing_classification;
          const conf = formatPct(rc.confidence);
          primaryCardHtml = `
            <div class="p-5 rounded-[16px] bg-[#E8F2FC] border border-[#C5DCF5] flex items-center justify-between gap-4">
              <div class="text-base font-bold text-[#0F1B2D]">${rc.action}</div>
              <span class="text-xs font-mono font-medium px-2.5 py-0.5 rounded bg-white/80 text-[#0F2A4A] shrink-0">Confidence: ${conf}</span>
            </div>
          `;
        }

        const srcBullets = extractBulletLines(data.matched_source.content);
        const srcChips = renderStructuredChips(data.matched_source.rules);

        out.innerHTML = `
          <div class="space-y-5">
            ${primaryCardHtml}

            <div class="space-y-2 pt-1">
              <div class="flex items-center gap-2 text-xs font-semibold text-[#5B6576] px-1">
                <svg class="w-3.5 h-3.5 text-[#1565C0]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Source &amp; Reference Guideline</span>
              </div>

              <div class="bg-white border border-[#E6EAF0] rounded-[16px] p-5">
                <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3">
                  <h3 class="text-base font-bold text-[#0F1B2D]">${data.matched_source.entity}</h3>
                  <span class="text-xs text-[#5B6576]">${data.matched_source.category}</span>
                </div>
                ${srcChips}
                <ul class="space-y-2 text-sm text-[#1B2433]">
                  ${srcBullets.map(b => `<li class="flex items-start gap-2 leading-relaxed"><span class="text-[#5B6576] select-none">&bull;</span><span>${b}</span></li>`).join('')}
                </ul>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        out.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-[16px] p-4 text-sm">
            Jewel is currently unavailable. Please use the top Search bar or contact IT support.
          </div>
        `;
      }
    }

    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeSearch();
    });
    document.getElementById('askInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeDecision();
    });

    loadKB();
  </script>
</body>
</html>
